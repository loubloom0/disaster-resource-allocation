# Production credentials must come from the deployment environment.
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Jwt secret is Base64-encoded and validated by SecurityConfig as at least 256 bits.
dras.auth.jwt-secret=${DRAS_JWT_SECRET:}

# Refresh credentials are only sent over HTTPS. Trust forwarded proto headers from the
# configured reverse proxy so Spring recognizes TLS-terminated production requests.
dras.auth.cookie-secure=true
server.forward-headers-strategy=framework

# The project currently has no Actuator dependency. Keep management endpoints closed if
# it is added later; application health remains available through the existing /api/health.
management.endpoints.enabled-by-default=false
management.endpoints.web.exposure.exclude=*
