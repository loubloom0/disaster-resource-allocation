# Credentials come from environment variables -- never hardcode secrets here.
# Defaults are only for host/port/db name; DB_PASSWORD has NO default on purpose.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dras}
spring.datasource.username=${DB_USER:dras_app}
spring.datasource.password=${DB_PASSWORD}

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000

server.port=${SERVER_PORT:8080}

# Failure injection is OFF unless explicitly enabled (simulation/test mode only).
dras.failure-injection.enabled=${DRAS_FAILURE_INJECTION:false}

# JWT signing key is supplied through the environment. If omitted in local development,
# the application generates an ephemeral process-only key and logs a warning.
dras.auth.jwt-secret=${DRAS_JWT_SECRET:}
dras.auth.access-token-seconds=${DRAS_ACCESS_TOKEN_SECONDS:900}
dras.auth.refresh-token-days=${DRAS_REFRESH_TOKEN_DAYS:14}
dras.auth.cookie-secure=${DRAS_AUTH_COOKIE_SECURE:false}
dras.auth.bootstrap.credentials-file=${DRAS_INITIAL_CREDENTIALS_FILE:${user.home}/.config/dras/initial-accounts.txt}
